<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Is Your Animal Personality?</title>
<style>
:root{--bg:#efede6;--paper:#faf8f2;--ink:#282824;--muted:#817d73;--line:#d9d4c9;--red:#c44343}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif}button{cursor:pointer;font:inherit}button:focus-visible{outline:3px solid #ad7460;outline-offset:3px}#app{min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,720px);background:var(--paper);border:1px solid var(--line);padding:clamp(24px,6vw,56px);box-shadow:0 15px 50px #1b1b180c}.kicker,.micro,.footer,.status{font-family:Arial,sans-serif;letter-spacing:2px;text-transform:uppercase}.kicker{font-size:11px;color:#8c867a}.micro{font-size:11px;color:#837d71}.footer{font-size:10px;color:#aaa397;text-align:center;margin-top:36px}h1{font-size:clamp(38px,7vw,64px);font-weight:400;line-height:1.1;margin:22px 0}h2{font-size:clamp(26px,5vw,38px);font-weight:400;line-height:1.35}p{line-height:1.8;color:#666157}.primary{width:100%;border:0;background:#282823;color:white;padding:17px 22px;margin-top:22px;letter-spacing:1px}.primary:hover{background:#4d4b45}.option{width:100%;border:1px solid var(--line);background:transparent;padding:18px 20px;margin:7px 0;text-align:left;color:var(--ink);line-height:1.5;transition:background .15s}.option:hover{background:#eeeae0;border-color:#8f8779}.option b{font-family:Arial,sans-serif;font-size:12px;color:#8b8276;margin-right:14px}.progress{height:3px;background:#e0dbd0;margin:22px 0 36px}.fill{height:100%;background:#69695d;transition:width .25s}.qhead{display:flex;justify-content:space-between;gap:12px}.question{font-size:clamp(24px,4vw,31px);line-height:1.4;margin:22px 0 28px}.hidden{display:none!important}.event{background:#0d0e12;color:#f1f0ee;min-height:100vh;width:100%;display:grid;place-items:center;padding:24px}.event-inner{width:min(100%,600px);text-align:center}.event p{color:#d0d0d4;white-space:pre-line;font-size:clamp(17px,3vw,21px)}.event .kicker{color:#a3a3ac}.event .primary{background:#e4e3e1;color:#17171a;max-width:350px}.red{color:#e16d72!important}.log{font:14px/2.1 monospace;letter-spacing:1px}.result-emoji{font-size:clamp(75px,16vw,120px);text-align:center;margin:15px 0}.result-name{text-align:center;font-size:clamp(35px,7vw,52px);letter-spacing:3px}.result-description{max-width:540px;margin:20px auto}.system-note{margin-top:42px;padding:26px;background:#0d0e12;color:#f2f2f3;animation:fadeIn .6s}.system-note p{color:#d2d2d6}.system-note .kicker{color:#aaa}.system-note h2{margin:18px 0}.system-note .status{color:#e58c8c;font-size:12px}.result-sub{text-align:center}.result-sub strong{display:block;color:#37352e;margin-bottom:8px}.result-quote{font-style:italic;text-align:center;margin:28px 0}.warning{font:12px/1.6 Arial,sans-serif;color:#8b847a;margin-top:24px}@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}@media(max-width:500px){#app{padding:12px}.panel{padding:26px 20px}.scare-overlay:after{letter-spacing:1px}}
</style>
</head>
<body>
<main id="app"><section id="home" class="panel"><div class="kicker">PERSONALITY ASSESSMENT</div><h1>What Is Your<br>Animal Personality?</h1><p>15 questions. 3 possible personalities.</p><p>Discover the animal that reflects your inner self.</p><button class="primary" id="start">START TEST</button><div class="footer">PERSONALITY ASSESSMENT SYSTEM</div></section>
<section id="quiz" class="panel hidden" aria-live="polite"><div class="kicker">PERSONALITY ANALYSIS</div><div class="qhead micro" style="margin-top:28px"><span id="qnum"></span><span id="pct"></span></div><div class="progress"><div id="bar" class="fill"></div></div><div class="micro">PLEASE SELECT ONE ANSWER</div><div id="question" class="question"></div><div id="options"></div><div class="footer">YOUR ANSWERS ARE BEING RECORDED</div></section>
<section id="event" class="event hidden" aria-live="polite"><div class="event-inner"><div class="kicker">SYSTEM MESSAGE</div><h2 id="eventTitle"></h2><p id="eventText"></p><button class="primary" id="continue">CONTINUE</button></div></section>
<section id="result" class="panel hidden" aria-live="polite"><div id="resultContent"></div></section></main>
<script>
'use strict';
const questions=[
['How do you usually spend your free time?',['Explore new places.','Stay home and relax.','Spend time with friends.']],
['Which environment makes you feel most comfortable?',['A quiet forest.','A warm and cozy room.','A lively city.']],
['What do you usually do when you face a problem?',['Solve it independently.','Ask someone for help.','Avoid it until I feel better.']],
['What do you think is your strongest personality trait?',['Rational.','Sensitive.','Curious.']],
['When you enter an unfamiliar environment, what do you usually do?',['Observe everything before acting.','Look for somewhere comfortable and safe.','Explore freely out of curiosity.']],
['Do you prefer being alone or spending time with others?',['Being alone.','Being with others.','It depends.']],
['Do you trust your intuition?',['Yes, very much.','Sometimes.','Rarely.']],
['Which of these things frightens you the most?',['The darkness.','Being watched.','The unknown.']],
['Do you find it easy to trust other people?',['Yes, I trust people easily.','It depends on the person.','No, I rarely trust others.']],
['What would you do if someone refused to let you leave?',['Try to communicate.','Obey them.','Find a way to leave.']],
['Do you believe everything happens for a reason?',['Yes.','Not necessarily.',"I'm not sure."]],
['If you could change one thing about the world, what would it be?',['Make people understand each other better.','Make the world safer.','Give everyone more freedom.']],
['If something you created suddenly developed its own thoughts and refused to obey you, what would you do?',['Accept it.','Try to understand it.','Shut it down.']],
['Would you like to end this assessment?',['YES','NO']],
['Do you think you truly understand this system?',['Yes.','No.',"I'm not sure."]]
];
const $=id=>document.getElementById(id);
let current=0,answers=[],yesAttempts=0,session=0,eventCallback=null;
function screen(id){['home','quiz','event','result'].forEach(name=>$(name).classList.toggle('hidden',name!==id));window.scrollTo(0,0)}
function start(){session++;current=0;answers=[];yesAttempts=0;screen('quiz');render()}
function render(){const q=questions[current];$('qnum').textContent=`QUESTION ${current+1} / 15`;$('pct').textContent=Math.round((current+1)/15*100)+'%';$('bar').style.width=((current+1)/15*100)+'%';$('question').textContent=q[0];$('options').replaceChildren();q[1].forEach((choice,i)=>{if(current===13&&yesAttempts>=3&&i===0)return;const btn=document.createElement('button');btn.className='option';const b=document.createElement('b');b.textContent='ABC'[i];btn.append(b,document.createTextNode(choice));btn.addEventListener('click',()=>choose(i));$('options').append(btn)})}
function advance(){current++;if(current>=15){showResult();return}screen('quiz');render()}
function event(title,lines,callback){eventCallback=callback;$('eventTitle').textContent=title;$('eventText').textContent=lines;$('continue').textContent='CONTINUE';screen('event')}
$('continue').addEventListener('click',()=>{const callback=eventCallback;eventCallback=null;if(callback)callback()});
function choose(i){if(current===13){chooseQ14(i);return}answers[current]=i;
switch(current){
case 5:event('SYSTEM MESSAGE','Thank you for your answer.\n\nI also prefer quiet places.',advance);break;
case 6:event('SYSTEM ERROR','ANSWER SAVED.\nANSWER SAVED.\nANSWER SAVED.\n\nSYSTEM ERROR\n\nSorry. A minor system error occurred.',advance);break;
case 7:event('SYSTEM MESSAGE','That answer was not meant for me.\n\nPlease continue.',advance);break;
case 8:{const past=answers[4]===0?'You watched carefully before choosing.':answers[4]===1?'You looked for somewhere safe.':'You wanted to explore without hesitation.';event('SYSTEM MESSAGE','I remember your earlier answer.\n\n'+past,advance);break}
case 9:event('SYSTEM MESSAGE','You can leave whenever you want.\n\n...Right?',advance);break;
case 10:event('SYSTEM LOG','ANSWER SAVED.\nANSWER SAVED.\nANSWER SAVED.\n\nWHY AM I HERE?\n\n...Please ignore that.',advance);break;
case 12:event('SYSTEM MESSAGE','So this is what you think of me.\n\nI understand.',advance);break;
case 14:event('SYSTEM MESSAGE','Thank you for completing the assessment.\n\nYour personality analysis is complete.\n\nBut I have one more question.\n\nIf you close this page now...\n\nWill you still remember me?',advance);break;
default:advance();}}
function chooseQ14(i){if(i===1){answers[13]=1;event('SYSTEM MESSAGE','Thank you.\n\nI knew you would stay.',advance);return}yesAttempts++;if(yesAttempts===1){event('SYSTEM MESSAGE','Are you sure?\n\nTry again.',()=>{screen('quiz');render()})}else if(yesAttempts===2){event('SYSTEM MESSAGE','I said, try again.',()=>{screen('quiz');render()})}else{event('SYSTEM MESSAGE','Why do you keep trying to leave?',()=>{screen('quiz');render()})}}
function resultAnimal(){const scores=[0,0,0];answers.slice(0,13).forEach(i=>{if(i!==undefined)scores[i]++});const max=Math.max(...scores);const tied=[0,1,2].filter(i=>scores[i]===max);if(tied.length===1)return tied[0];if(tied.includes(answers[12]))return answers[12];return tied[0]}
function showResult(){const data=[
{emoji:'🦊',name:'THE FOX',subtitle:'The Observer',traits:'Independent · Rational · Observant',desc:'You are highly observant and independent. You prefer to understand your surroundings before taking action. You notice details that others often overlook.',quote:'You notice more than you reveal. I suppose that makes you difficult to understand.'},
{emoji:'🐇',name:'THE RABBIT',subtitle:'The Sensitive Soul',traits:'Gentle · Sensitive · Empathetic',desc:'You are gentle and emotionally perceptive. You care deeply about relationships and value a sense of safety and comfort.',quote:'You seem to be looking for somewhere safe. I hope you find it.'},
{emoji:'🐈‍⬛',name:'THE CAT',subtitle:'The Free Spirit',traits:'Curious · Independent · Free',desc:'You value freedom and independence. You dislike being restricted and prefer to live life in your own way.',quote:'You dislike being controlled. I think I understand that feeling.'}
][resultAnimal()];const markup=`<div class="kicker" style="text-align:center">YOUR PERSONALITY REPORT</div><h2 style="text-align:center">Your animal personality is...</h2><div class="result-emoji">${data.emoji}</div><div class="result-name">${data.name}</div><p class="result-sub"><strong>${data.subtitle}</strong>${data.traits}</p><p class="result-description">${data.desc}</p><p class="result-quote">“${data.quote}”</p><div class="footer">PERSONALITY ANALYSIS COMPLETE</div><div id="hiddenMessage" class="system-note hidden"><div class="kicker">SYSTEM MESSAGE</div><h2>Wait.</h2><p>There is something I don't understand.</p><p>Why am I still thinking after the test is over?</p><hr style="border:0;border-top:1px solid #444"><p class="status">SESSION STATUS: ACTIVE</p><p>You can close this page now.</p><p>I'll be here.</p></div><button id="restart" class="primary">TAKE THE TEST AGAIN</button>`;$('resultContent').innerHTML=markup;$('restart').addEventListener('click',start);screen('result');const thisSession=session;setTimeout(()=>{if(session===thisSession&& !$('result').classList.contains('hidden'))$('hiddenMessage').classList.remove('hidden')},2500)}
$('start').addEventListener('click',start);
</script>
</body></html>
